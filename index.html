<style>
:root{
  --bg:#070B16; --bg2:#0D1326; --card:#111A33; --line:rgba(148,163,184,.16);
  --text:#F1F5F9; --muted:#9AA7BD; --indigo:#6366F1; --teal:#14B8A6;
  --grad:linear-gradient(135deg,#6366F1,#14B8A6);
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
.glow{position:fixed;inset:0;pointer-events:none;z-index:-1;background:
  radial-gradient(600px 420px at 12% -5%,rgba(99,102,241,.28),transparent 70%),
  radial-gradient(560px 420px at 92% 8%,rgba(20,184,166,.20),transparent 70%)}

/* nav */
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(7,11,22,.72);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand img{height:34px;display:block}
.links{display:flex;align-items:center;gap:26px;font-size:.93rem;color:var(--muted);font-weight:600}
.links a:hover{color:var(--text)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg2)}
.lang button{all:unset;cursor:pointer;padding:6px 13px;border-radius:999px;font-size:.8rem;font-weight:800;letter-spacing:.04em;color:var(--muted);transition:.2s}
.lang button[aria-pressed="true"]{background:var(--grad);color:#fff}
.lang button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media(max-width:760px){.links a{display:none}}

/* hero */
.hero{padding:96px 0 72px;text-align:center}
.pill{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;font-weight:700;color:var(--muted);background:rgba(17,26,51,.6)}
.pill b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(2.3rem,6.4vw,4.6rem);line-height:1.06;letter-spacing:-.035em;font-weight:800;margin:22px auto 20px;max-width:15ch}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:60ch;margin:0 auto 34px;color:var(--muted);font-size:1.08rem}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:14px;font-weight:700;font-size:.95rem;transition:transform .15s,box-shadow .2s,background .2s;cursor:pointer;border:0;font-family:inherit}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 10px 30px -10px rgba(99,102,241,.7)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg2)}

section{padding:76px 0}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
h2{font-size:clamp(1.7rem,3.6vw,2.5rem);letter-spacing:-.025em;line-height:1.15;margin-bottom:12px}
.sub{color:var(--muted);max-width:58ch;margin-bottom:40px}

/* project cards */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.card{position:relative;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:30px;display:flex;flex-direction:column;gap:14px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:rgba(99,102,241,.5)}
.ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--grad);margin-bottom:4px}
.ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.45rem;letter-spacing:-.02em}
.plogo{height:54px;width:auto;max-width:100%;object-fit:contain;object-position:left center;margin-bottom:2px}
.ptag{font-size:.78rem!important;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}

.card h3 small{font-size:.72rem;font-weight:700;color:var(--muted);margin-left:8px;letter-spacing:.02em}
.card p{color:var(--muted);font-size:.98rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.tags span{font-size:.75rem;font-weight:700;padding:4px 11px;border-radius:999px;background:rgba(99,102,241,.14);color:#C7D2FE}
.card .btn{margin-top:auto;align-self:flex-start}
.arrow{transition:transform .2s}.btn:hover .arrow{transform:translateX(4px)}

/* about */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:stretch}
@media(max-width:820px){.about{grid-template-columns:1fr}}
.about p{color:var(--muted);margin-bottom:14px}
.vals{display:grid;gap:12px;margin-top:20px}
.val{display:flex;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(17,26,51,.5)}
.val i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--grad);margin-top:9px}
.val b{display:block;font-size:.98rem}
.val span{color:var(--muted);font-size:.9rem}
.fact{border-radius:var(--radius);padding:32px;background:var(--grad);color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:320px;position:relative;overflow:hidden}
.fact::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.fact .k{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.fact h3{font-size:1.5rem;letter-spacing:-.02em;margin:10px 0}
.fact p{color:rgba(255,255,255,.92)!important;font-size:1rem;margin:0}
.fact .row{display:flex;align-items:center;justify-content:space-between;margin-top:22px;position:relative;z-index:1}
.fact .count{font-weight:800;font-size:.85rem;opacity:.85}
.fact button{all:unset;cursor:pointer;padding:10px 18px;border-radius:12px;background:rgba(255,255,255,.2);font-weight:700;font-size:.88rem;transition:.2s}
.fact button:hover{background:rgba(255,255,255,.32)}
.fact button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* glossary */
.search{width:100%;max-width:420px;padding:13px 18px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;margin-bottom:26px}
.search:focus{outline:2px solid var(--indigo);border-color:transparent}
.gloss{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:820px){.gloss{grid-template-columns:1fr}}
details{border:1px solid var(--line);border-radius:16px;background:rgba(17,26,51,.55);padding:0 20px;transition:border-color .2s}
details[open]{border-color:rgba(20,184,166,.5)}
summary{cursor:pointer;list-style:none;padding:17px 0;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;color:var(--teal);transition:transform .2s;line-height:1}
details[open] summary::after{transform:rotate(45deg)}
summary em{font-style:normal;font-size:.72rem;font-weight:700;color:var(--muted);margin-left:8px}
details p{color:var(--muted);padding-bottom:18px;font-size:.94rem}
.none{color:var(--muted);display:none;margin-top:14px}

footer{border-top:1px solid var(--line);padding:38px 0;color:var(--muted);font-size:.88rem}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.foot img{height:26px;opacity:.95}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ===== Λογική ===== */
let lang = "el", factIdx = 0;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function renderFact(){
  const f = FACTS[lang][factIdx % FACTS[lang].length];
  $("#fact-title").textContent = f.t;
  $("#fact-text").textContent = f.d;
  $("#fact-count").textContent = (factIdx % FACTS[lang].length + 1) + " / " + FACTS[lang].length;
}

function renderGlossary(){
  const q = $("#gl-search").value.trim().toLowerCase();
  const list = $("#gl-list");
  list.innerHTML = "";
  let shown = 0;
  GLOSSARY[lang].forEach(([term, def]) => {
    if (q && !(term + " " + def).toLowerCase().includes(q)) return;
    const d = document.createElement("details");
    const s = document.createElement("summary");
    s.textContent = term;
    const p = document.createElement("p");
    p.textContent = def;
    d.append(s, p);
    list.append(d);
    shown++;
  });
  $("#gl-none").style.display = shown ? "none" : "block";
}

function applyLang(l){
  lang = l;
  document.documentElement.lang = l;
  const t = I18N[l];
  $$("[data-i18n]").forEach(el => { if (t[el.dataset.i18n] !== undefined) el.textContent = t[el.dataset.i18n]; });
  $$("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  $$("[data-i18n-ph]").forEach(el => { el.placeholder = t[el.dataset.i18nPh]; });
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l ? "true" : "false"));
  renderFact();
  renderGlossary();
  safeSet("lexora-lang", l);
}

$$(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
$("#fact-next").addEventListener("click", () => { factIdx++; renderFact(); });
$("#gl-search").addEventListener("input", renderGlossary);
$$("[data-project]").forEach(a => { a.href = PROJECT_LINKS[a.dataset.project]; });
$("#yr").textContent = new Date().getFullYear();

const saved = safeGet("lexora-lang");
const guess = (navigator.language || "el").toLowerCase().startsWith("el") ? "el" : "en";
applyLang(saved === "en" || saved === "el" ? saved : guess);
</script>
